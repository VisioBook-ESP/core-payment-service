name: Dependency Update

on:
  schedule:
    - cron: '0 8 * * 1'  # Lundi 08h00 UTC
  workflow_dispatch:

jobs:
  update:
    name: Check & Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Check for updates
        id: check
        run: |
          ncu --format json > /tmp/updates.json || true
          COUNT=$(cat /tmp/updates.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update dependencies
        if: steps.check.outputs.count != '0'
        run: |
          ncu -u --target minor
          npm install

      - name: Run tests after update
        if: steps.check.outputs.count != '0'
        run: npm test -- --passWithNoTests --forceExit

      - name: Create Pull Request
        if: steps.check.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies (minor)'
          title: 'chore: weekly dependency update'
          body: |
            Mise à jour automatique des dépendances (patch + minor).

            Vérifier que tous les tests passent avant de merger.
          branch: chore/dependency-update
          base: dev
          labels: dependencies
