name: core-payment-service
replicaCount: 1
image:
  repository: ghcr.io/visiobook-esp/core-payment-service-dev
  tag: "sha-eb5660a"
  pullPolicy: IfNotPresent

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

revisionHistoryLimit: 3
progressDeadlineSeconds: 60
minReadySeconds: 10
terminationGracePeriodSeconds: 10

syncWave: "0"

existingSecret: ""
existingSecretPgcrud: ""

service:
  type: ClusterIP
  port: 8087

istio:
  enabled: true
  injection: true

  virtualService:
    enabled: true
    hosts:
      - "core-payment-service"
      - "core-payment-service.visiobook.dev"
    gateways:
      - mesh
  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 100
        http:
          http1MaxPendingRequests: 100
          http2MaxRequests: 100
          maxRequestsPerConnection: 2
      loadBalancer:
        simple: ROUND_ROBIN
      outlierDetection:
        consecutiveErrors: 5
        interval: 30s
        baseEjectionTime: 30s

  mtls:
    enabled: true
    mode: ISTIO_MUTUAL

nodeSelector: {}
tolerations: []
affinity: {}

podLabels:
  app: core-payment-service
  version: "latest"
  app.kubernetes.io/name: core-payment-service
  app.kubernetes.io/version: "latest"
  app.kubernetes.io/component: backend

selectorLabels:
  app: core-payment-service
  version: latest

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env:
  APP_NAME: core-payment-service
  APP_VERSION: 0.1.0
  APP_PORT: "8087"
  API_PREFIX: /api/v1
  NODE_ENV: production
  LOG_LEVEL: info
  SWAGGER_ENABLED: "false"
  DATABASE_SERVICE_URL: http://core-database-service.visiobook-namespace.svc.cluster.local:8095
  USER_SERVICE_URL: http://core-user-service.visiobook-namespace.svc.cluster.local:8081
  NOTIFICATION_SERVICE_URL: http://core-notification-service.visiobook-namespace.svc.cluster.local:8088
  REDIS_HOST: redis.visiobook-namespace.svc.cluster.local
  REDIS_PORT: "6379"

# Sensitive values — override via sealed secrets or external secret manager in production
secrets:
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

probes:
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilization: 70

serviceMonitor:
  enabled: false
  interval: 30s
