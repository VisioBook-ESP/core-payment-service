version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '8087:8087'
    environment:
      - NODE_ENV=development
      - PORT=8087
      - API_PREFIX=/api/v1
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - DATABASE_URL=postgresql://payment_app:localdevpass@postgres:5432/payment
      - USER_SERVICE_URL=http://host.docker.internal:8081
      - NOTIFICATION_SERVICE_URL=http://host.docker.internal:8088
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key}
      - USER_SERVICE_MOCK=${USER_SERVICE_MOCK:-false}
      - LOG_LEVEL=debug
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: localdevpass
      POSTGRES_DB: payment
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payment_app -d payment']
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
